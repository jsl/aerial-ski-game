<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aerial Ski Game — Regression Tests</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #0d1117; color: #c9d1d9; padding: 24px; }
  h1 { font-size: 18px; color: #58a6ff; margin-bottom: 4px; }
  #meta { font-size: 12px; color: #8b949e; margin-bottom: 20px; }
  #summary { font-size: 15px; font-weight: bold; margin-bottom: 20px; padding: 10px 14px;
             border-radius: 6px; display: inline-block; }
  .pass-summary { background: #0d3321; color: #3fb950; border: 1px solid #26a641; }
  .fail-summary { background: #3d1a1a; color: #f85149; border: 1px solid #b62324; }

  .section { margin-bottom: 24px; }
  .section-title { font-size: 13px; font-weight: bold; color: #8b949e; letter-spacing: 0.05em;
                   text-transform: uppercase; margin-bottom: 8px; border-bottom: 1px solid #21262d;
                   padding-bottom: 6px; }
  .test { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;
          border-bottom: 1px solid #161b22; font-size: 13px; }
  .badge { flex-shrink: 0; width: 42px; text-align: center; padding: 1px 4px;
           border-radius: 4px; font-size: 11px; font-weight: bold; }
  .badge-pass { background: #0d3321; color: #3fb950; border: 1px solid #26a641; }
  .badge-fail { background: #3d1a1a; color: #f85149; border: 1px solid #b62324; }
  .badge-skip { background: #1c2128; color: #8b949e; border: 1px solid #30363d; }
  .test-name { flex: 1; }
  .test-err  { color: #f85149; font-size: 12px; margin-top: 2px; white-space: pre-wrap; }
  #loading { color: #8b949e; font-size: 14px; }
  #error-box { display: none; padding: 10px 14px; background: #3d1a1a; border: 1px solid #b62324;
               border-radius: 6px; margin-bottom: 20px; color: #f85149; font-size: 13px;
               white-space: pre-wrap; }
</style>
</head>
<body>

<h1>⛷  Aerial Ski Game — Regression Tests</h1>
<div id="meta"></div>
<div id="error-box"></div>
<div id="summary" style="display:none"></div>
<div id="loading">Loading game engine…</div>
<div id="results"></div>

<!-- ── Required DOM stubs (game.js accesses these by ID) ──────────────── -->
<canvas id="renderCanvas" width="800" height="600" style="display:none"></canvas>
<div id="powerMeter"      style="display:none">
  <div id="powerMeterFill"></div>
  <div id="powerMeterTicks"></div>
</div>
<div id="compHUD" style="display:none"></div>

<!-- ── Scripts ─────────────────────────────────────────────────────────── -->
<script src="babylon-stub.js"></script>
<!-- Shared engine core — must precede game.js, which reads AerialEngine.*.
     Dependency order: inertia needs math and bodyModel. -->
<script src="../engine/core/math.js"></script>
<script src="../engine/core/body-model.js"></script>
<script src="../engine/core/pose.js"></script>
<script src="../engine/core/inertia.js"></script>
<script src="../engine/core/power.js"></script>
<script src="../engine/core/rotation.js"></script>
<script src="../render/textures.js"></script>
<script src="../engine/core/tricks.js"></script>
<script src="../engine/core/landing.js"></script>
<script src="../engine/disciplines/aerial-ski.js"></script>
<script src="../engine/core/kinematics.js"></script>
<script src="../game.js"></script>
<script>
'use strict';

// ── Test framework ────────────────────────────────────────────────────────
const _sections = [];
let   _currentSection = null;

function section(title) {
    _currentSection = { title, tests: [] };
    _sections.push(_currentSection);
}
function test(name, fn) {
    const t = { name, ok: false, err: null, skipped: false };
    try {
        fn();
        t.ok = true;
    } catch (e) {
        t.ok  = false;
        t.err = e.message || String(e);
    }
    _currentSection.tests.push(t);
}
function skip(name, reason) {
    _currentSection.tests.push({ name, ok: false, err: reason, skipped: true });
}
function assert(cond, msg) {
    if (!cond) throw new Error(msg || 'assertion failed');
}
function assertClose(a, b, tol, msg) {
    if (Math.abs(a - b) > tol) throw new Error(msg || `expected ~${b}, got ${a} (diff ${Math.abs(a-b).toFixed(4)} > ${tol})`);
}
function assertGreater(a, b, msg) {
    if (a <= b) throw new Error(msg || `expected ${a} > ${b}`);
}
function assertLess(a, b, msg) {
    if (a >= b) throw new Error(msg || `expected ${a} < ${b}`);
}

// ── Render results ────────────────────────────────────────────────────────
function renderResults() {
    document.getElementById('loading').style.display = 'none';
    const out = document.getElementById('results');
    let totalPass = 0, totalFail = 0, totalSkip = 0;

    for (const sec of _sections) {
        const wrap = document.createElement('div');
        wrap.className = 'section';
        const title = document.createElement('div');
        title.className = 'section-title';
        title.textContent = sec.title;
        wrap.appendChild(title);

        for (const t of sec.tests) {
            const row  = document.createElement('div');
            row.className = 'test';
            const badge = document.createElement('span');
            badge.className = t.skipped ? 'badge badge-skip' : (t.ok ? 'badge badge-pass' : 'badge badge-fail');
            badge.textContent = t.skipped ? 'skip' : (t.ok ? 'pass' : 'FAIL');
            const name = document.createElement('div');
            name.className = 'test-name';
            name.textContent = t.name;
            row.appendChild(badge);
            row.appendChild(name);
            if (!t.ok && t.err) {
                const err = document.createElement('div');
                err.className = 'test-err';
                err.textContent = '↳ ' + t.err;
                name.appendChild(err);
            }
            wrap.appendChild(row);
            if (t.skipped) totalSkip++;
            else if (t.ok)  totalPass++;
            else             totalFail++;
        }
        out.appendChild(wrap);
    }

    const sum = document.getElementById('summary');
    sum.style.display = 'inline-block';
    if (totalFail === 0) {
        sum.className = 'pass-summary';
        sum.textContent = `✓ All ${totalPass} tests passed` + (totalSkip ? `  (${totalSkip} skipped)` : '');
    } else {
        sum.className = 'fail-summary';
        sum.textContent = `✗ ${totalFail} failed / ${totalPass} passed` + (totalSkip ? ` / ${totalSkip} skipped` : '');
    }
}

// ─────────────────────────────────────────────────────────────────────────
// SECTION A — Pure math (top-level game.js functions)
// These run SYNCHRONOUSLY after game.js is parsed but before DOMContentLoaded
// fires. All top-level consts (SLOPE_ANGLE, KICKER_Z, …) and functions (lerp,
// computeI, terrainRootY, terrainAccelZ, armSweep) are already available.
// ─────────────────────────────────────────────────────────────────────────
section('A — Pure Math (lerp, computeI, terrain, armSweep)');

test('lerp(0, 10, 0) === 0', () => {
    assertClose(lerp(0, 10, 0), 0, 1e-9, 'lerp at t=0 should return a');
});
test('lerp(0, 10, 1) === 10', () => {
    assertClose(lerp(0, 10, 1), 10, 1e-9, 'lerp at t=1 should return b');
});
test('lerp(0, 10, 0.5) === 5', () => {
    assertClose(lerp(0, 10, 0.5), 5, 1e-9);
});
test('computeI(0) is finite and positive', () => {
    const I = computeI(0);
    assert(isFinite(I) && I > 0, `computeI(0) = ${I}`);
});
test('computeI(1) is finite and positive', () => {
    const I = computeI(1);
    assert(isFinite(I) && I > 0, `computeI(1) = ${I}`);
});
test('tuck reduces inertia: computeI(0) > computeI(1)', () => {
    assertGreater(computeI(0), computeI(1),
        `Extended I(${computeI(0).toFixed(3)}) should exceed tucked I(${computeI(1).toFixed(3)})`);
});
test('computeI is monotonically decreasing from tuck=0 to tuck=1', () => {
    let prev = computeI(0);
    for (const t of [0.25, 0.5, 0.75, 1.0]) {
        const I = computeI(t);
        assert(I <= prev + 1e-9, `I(${t}) = ${I.toFixed(4)} is not ≤ I(${(t-0.25).toFixed(2)}) = ${prev.toFixed(4)}`);
        prev = I;
    }
});
test('terrainRootY: kicker top is higher than flat table', () => {
    const tableY  = terrainRootY(KICKER_Z - 1);   // on the flat table
    const topY    = terrainRootY(KICKER_END_Z);    // at the lip of the kicker
    assertGreater(topY, tableY,
        `Kicker top (${topY.toFixed(3)}) should be above flat table (${tableY.toFixed(3)})`);
});
test('terrainRootY: continuous at FLAT_Z (slope→table)', () => {
    const eps  = 0.01;
    const yBefore = terrainRootY(FLAT_Z - eps);
    const yAfter  = terrainRootY(FLAT_Z + eps);
    assertClose(yBefore, yAfter, 0.05,
        `Discontinuity at FLAT_Z: before=${yBefore.toFixed(4)}, after=${yAfter.toFixed(4)}`);
});
test('terrainRootY: continuous at KICKER_Z (table→kicker)', () => {
    const eps     = 0.01;
    const yBefore = terrainRootY(KICKER_Z - eps);
    const yAfter  = terrainRootY(KICKER_Z + eps);
    assertClose(yBefore, yAfter, 0.05,
        `Discontinuity at KICKER_Z: before=${yBefore.toFixed(4)}, after=${yAfter.toFixed(4)}`);
});
test('terrainAccelZ: flat table has zero acceleration', () => {
    const midTable = (FLAT_Z + KICKER_Z) / 2;
    assertClose(terrainAccelZ(midTable), 0, 1e-9,
        `Flat table accel should be 0, got ${terrainAccelZ(midTable)}`);
});
test('terrainAccelZ: slope accelerates skier toward kicker (+Z)', () => {
    const midSlope = (SLOPE_START_Z + FLAT_Z) / 2;
    assertGreater(terrainAccelZ(midSlope), 0,
        `Slope accel should be positive, got ${terrainAccelZ(midSlope)}`);
});
test('terrainAccelZ: kicker decelerates the skier (negative)', () => {
    const midKicker = (KICKER_Z + KICKER_END_Z) / 2;
    assertLess(terrainAccelZ(midKicker), 0,
        `Kicker accel should be negative, got ${terrainAccelZ(midKicker)}`);
});
test('armSweep: outputs are finite for t = 0, 0.5, 1', () => {
    for (const t of [0, 0.5, 1]) {
        const r = armSweep('upperArmL', null, t);
        assert(isFinite(r.x) && isFinite(r.y) && isFinite(r.rx),
            `armSweep at t=${t} produced non-finite value`);
    }
});
test('armSweep: arm is higher when raised (t=0) than when dropped (t=1)', () => {
    const raised  = armSweep('upperArmL', null, 0);
    const dropped = armSweep('upperArmL', null, 1);
    assertGreater(raised.y, dropped.y,
        `Raised arm y(${raised.y.toFixed(3)}) should exceed dropped y(${dropped.y.toFixed(3)})`);
});

// ─────────────────────────────────────────────────────────────────────────
// SECTION B — Regression formula checks
// These document the intended power-meter behaviour and guard against
// accidental changes to the formula.
//
// INTENDED DESIGN:
//   • No charge  →  barely any flip (~6.7% speed)
//   • 3rd dash (75%)  →  perfect world-normal flip speed (1.0×)
//   • Full charge (100%)  →  slightly more than normal (~1.33×)
//
// Formula: Math.max(0.05, flipPower) / 0.75
// ─────────────────────────────────────────────────────────────────────────
section('B — Regression Formula Checks');

test('Power meter: unfilled gives near-zero flip speed (~6.7%)', () => {
    // INTENDED: not charging the bar = barely any rotation
    // Guard against load-order mistakes: engine/core/power.js must be loaded
    // before game.js so AerialEngine.power exists by the time these run.
    if (typeof AerialEngine === 'undefined' || !AerialEngine.power) {
        throw new Error(
            'AerialEngine.power is missing — engine/core/power.js must be loaded before game.js/tests');
    }
    const P = AerialEngine.power;
    const speed = P.flipSpeedMultiplier(0, false);
    const pct = (typeof speed === 'number') ? (speed * 100).toFixed(1) : String(speed);
    assert(speed < 0.1,
        `Unfilled meter should give < 10% flip speed, got ${pct}%`);
});
test('Power meter: 3rd dash (75%) gives exactly 100% flip speed', () => {
    // INTENDED: 3rd dash = perfect flip for the hill, i.e. the calibration power
    const P = AerialEngine.power;
    const speed = P.flipSpeedMultiplier(P.CALIBRATION_POWER, false);
    assertClose(speed, 1.0, 1e-9,
        `3rd-dash charge (${P.CALIBRATION_POWER}) should give exactly 1.0× speed`);
});
test('Power meter: full charge gives more than 100% flip speed', () => {
    // INTENDED: full bar = extra-fast flip beyond the perfect amount
    const P = AerialEngine.power;
    const speed = P.flipSpeedMultiplier(1.0, false);
    assertGreater(speed, 1.0,
        `Full charge (${speed}×) should exceed normal flip speed`);
});
test('Power meter: speed scales linearly above the minimum floor', () => {
    // Speed at 50% charge should sit between the minimum-floor speed and the
    // full-charge speed, with every value coming from AerialEngine.power.
    const P = AerialEngine.power;
    const speedFloor = P.flipSpeedMultiplier(0, false);
    const speedHalf = P.flipSpeedMultiplier(0.5, false);
    const speedFull = P.flipSpeedMultiplier(1.0, false);
    assert(speedFloor < speedHalf && speedHalf < speedFull,
        `Half-charge speed (${speedHalf}) should be between floor (${speedFloor}) and full (${speedFull})`);
});
test('REGRESSION: formula is NOT the clamped version (unfilled ≠ 100%)', () => {
    // Guards against re-introducing the April 2026 "fix" that set the keyboard
    // minimum power to CALIBRATION_POWER, so an unfilled meter always gave 100%
    // flip speed and broke the mechanic. The keyboard floor must stay well below
    // calibration power; gamepad mode keeps its own floor via MIN_POWER_GAMEPAD.
    const P = AerialEngine.power;
    const keyboardFloor = P.minPower(false);
    assertLess(keyboardFloor, P.CALIBRATION_POWER,
        `Keyboard min power (${keyboardFloor}) must be below calibration power (${P.CALIBRATION_POWER})`);
    const speedCorrect = P.flipSpeedMultiplier(0, false);
    const pct = (typeof speedCorrect === 'number') ? (speedCorrect * 100).toFixed(1) : String(speedCorrect);
    assert(speedCorrect < 0.1,
        `The correct formula must give < 10% at 0 charge, not ${pct}%`);
});

// ─────────────────────────────────────────────────────────────────────────
// SECTION C — Integration (requires game.js DOMContentLoaded to have run)
// Game setup is synchronous inside DOMContentLoaded, which fires before this
// listener because game.js registers its listener first during script parse.
// ─────────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {

    section('C — Integration (game initialisation)');

    test('window._getGameState is defined', () => {
        assert(typeof window._getGameState === 'function',
            'game.js should expose window._getGameState()');
    });

    test('initial state: grounded=true, crashed=false, stopped=false', () => {
        const s = window._getGameState();
        assert(s.grounded  === true,  `grounded should be true, got ${s.grounded}`);
        assert(s.crashed   === false, `crashed should be false, got ${s.crashed}`);
        assert(s.stopped   === false, `stopped should be false, got ${s.stopped}`);
    });

    test('initial posZ is at the top of the slope', () => {
        const s = window._getGameState();
        assert(s.posZ > SLOPE_START_Z,
            `posZ (${s.posZ.toFixed(2)}) should be above SLOPE_START_Z (${SLOPE_START_Z})`);
        assert(s.posZ < KICKER_Z,
            `posZ (${s.posZ.toFixed(2)}) should not yet be on the kicker`);
    });

    test('initial flipPower is 0', () => {
        const s = window._getGameState();
        assertClose(s.flipPower, 0, 1e-9, `flipPower should start at 0, got ${s.flipPower}`);
    });

    test('window._characterMeshes is defined', () => {
        assert(typeof window._characterMeshes === 'object' && window._characterMeshes !== null,
            'game.js should expose window._characterMeshes');
    });

    test('all 12 character segments exist in _characterMeshes', () => {
        const m = window._characterMeshes;
        const expected = ['torso','head',
            'upperArmL','upperArmR','lowerArmL','lowerArmR',
            'upperLegL','upperLegR','lowerLegL','lowerLegR',
            'skiL','skiR'];
        for (const seg of expected) {
            assert(m[seg] !== undefined, `Missing segment: "${seg}"`);
        }
    });

    test('character mesh segments have position and rotation objects', () => {
        const m   = window._characterMeshes;
        const seg = m['torso'];
        assert(typeof seg.position === 'object',  'torso.position should be an object');
        assert(typeof seg.rotation === 'object',  'torso.rotation should be an object');
        assert('x' in seg.position,               'position should have x property');
    });

    test('glove detail meshes exist on character', () => {
        const m = window._characterMeshes;
        assert(m.gloveL && m.gloveL.mesh, 'gloveL detail mesh should exist');
        assert(m.gloveR && m.gloveR.mesh, 'gloveR detail mesh should exist');
    });

    test('BABYLON._engine is the stub engine', () => {
        assert(BABYLON._engine !== null, 'Engine should have been constructed');
        assert(typeof BABYLON._engine._tick === 'function',
            'Engine should have _tick() test helper');
    });

    test('skierRoot TransformNode exists in node registry', () => {
        const root = BABYLON._nodes.get('skierRoot');
        assert(root !== undefined && root !== null,
            'skierRoot TransformNode should be in BABYLON._nodes');
    });

    test('no uncaught errors during game setup', () => {
        assert(BABYLON._lastError === null,
            `Uncaught error during setup: ${BABYLON._lastError}`);
    });

    // ── Section D — Simulation regression tests ──────────────────────────
    // Advance the game loop programmatically, then check that key invariants
    // hold. These are the most valuable regression tests: they catch bugs
    // that only manifest when the game is actually running.
    // ─────────────────────────────────────────────────────────────────────
    section('D — Simulation Regression Tests');

    // D1 — REGRESSION: Character rotation must be REASSIGNED each frame.
    //
    // The bug introduced in April 2026: rotation quaternion was pre-allocated
    // once and mutated in-place via ToRef/multiplyInPlace. Because Babylon.js
    // uses dirty-flag tracking on the property setter, the in-place mutation
    // never triggered the setter, so the character appeared frozen.
    //
    // This test catches that regression: run 60 frames and verify the setter
    // on skierRoot.rotationQuaternion fires at least 55 times (one per frame
    // minus a small tolerance for any skipped frames at boundaries).
    test('REGRESSION: skierRoot rotation reassigned every frame (not mutated in-place)', () => {
        const root = BABYLON._nodes.get('skierRoot');
        assert(root !== undefined, 'skierRoot must exist');
        const before = root._qSetCount;
        BABYLON._engine._tick(60);
        const after  = root._qSetCount;
        const calls  = after - before;
        assert(calls >= 55,
            `Rotation setter should fire ~1× per frame. Got ${calls} setter calls in 60 frames. ` +
            `If this is 0 or 1, the quaternion mutation regression has been re-introduced.`);
    });

    // D2 — Skier should start moving after ArrowUp is pressed.
    // Dispatches the real keydown event that game.js listens to.
    test('Skier moves after pressing ArrowUp (posZ increases)', () => {
        const initialZ = window._getGameState().posZ;
        window.dispatchEvent(new KeyboardEvent('keydown', { code: 'ArrowUp', bubbles: true }));
        // Run 120 frames (~2 s): 42 for ready-turn animation, then slope physics
        BABYLON._engine._tick(120);
        const newZ = window._getGameState().posZ;
        assertGreater(newZ, initialZ,
            `posZ should increase after starting. Was ${initialZ.toFixed(2)}, now ${newZ.toFixed(2)}`);
    });

    // D3 — Skier should become airborne after enough frames on slope mode.
    // 350 frames ≈ 5.8 s, which is more than enough to reach the kicker
    // (calculated: ~4.3 s for double hill from slope start to takeoff).
    test('Skier becomes airborne within 350 frames of starting', () => {
        let airtimeFrame = -1;
        for (let i = 0; i < 350; i++) {
            BABYLON._engine._tick(1);
            if (!window._getGameState().grounded) {
                airtimeFrame = i;
                break;
            }
        }
        assert(airtimeFrame >= 0,
            `Skier never left the ground in 350 frames. posZ=${window._getGameState().posZ.toFixed(2)}`);
    });

    // D4 — Once in the air, flipAngle must advance each frame.
    // This catches regressions where the physics loop runs but flip rotation
    // stops updating (e.g., wrong L_flip value, zero omega, clamped state).
    // Note: the simulation never fills the power meter, so the flip is slow
    // (~6.7% of normal speed) — but it must still be non-zero.
test('flipAngle advances while skier is airborne', () => {
        // At this point we should already be airborne from D3.
        let s = window._getGameState();
        if (s.grounded) {
            // D3 failed; try to get airborne as a best-effort before testing.
            BABYLON._engine._tick(200);
            s = window._getGameState();
        }
        if (s.grounded) {
            throw new Error('Could not reach airborne state — depends on D3 passing first');
        }
        const node = BABYLON._nodes.get('skierRoot');
        if (!node) {
            throw new Error("BABYLON._nodes has no entry named 'skierRoot' — cannot observe flip rotation through the scene graph");
        }
        const getQuat = () => {
            const q = node.rotationQuaternion;
            if (!q || typeof q.x !== 'number' || typeof q.y !== 'number' ||
                typeof q.z !== 'number' || typeof q.w !== 'number') {
                throw new Error('skierRoot.rotationQuaternion is null or malformed — expected a {x,y,z,w} quaternion to measure orientation change');
            }
            return { x: q.x, y: q.y, z: q.z, w: q.w };
        };
        const fmt = (v) => (typeof v === 'number' && Number.isFinite(v) ? v.toFixed(4) : String(v));
        const quat = getQuat();
        const before = { x: quat.x, y: quat.y, z: quat.z, w: quat.w };
        BABYLON._engine._tick(60);
        const after = getQuat();
        const dot = Math.abs(
            before.x * after.x +
            before.y * after.y +
            before.z * after.z +
            before.w * after.w
        );
        const delta = 2 * Math.acos(Math.min(1, dot));
        // Even at minimum power (6.7% speed), flip must still advance.
        // At ~0.3 rad/s minimum over 1 s we expect at least 0.02 rad.
        assert(delta > 0.01,
            `flip rotation barely changed in 60 frames of airtime: Δ${fmt(delta)} rad ` +
            `(orientation ${fmt(before.x)},${fmt(before.y)},${fmt(before.z)},${fmt(before.w)} → ` +
            `${fmt(after.x)},${fmt(after.y)},${fmt(after.z)},${fmt(after.w)}). ` +
            `This may indicate L_flip is zero or the physics loop is broken.`);
    });

    // D5 — At full power (meter filled to 75%), flip reaches the correct speed.
    // Dispatches ArrowDown keydown to fill the meter, then starts a new run.
    // This ensures the power-meter → L_flip path is wired correctly end-to-end.
    test('At 75% charge, flip reaches world-normal speed (≥ 1.0× TARGET_OMEGA)', () => {
        // Directly verify the formula result rather than simulating the full run,
        // since the run state is mid-jump at this point.
        const correctSpeed = Math.max(0.05, 0.75) / 0.75;
        assertClose(correctSpeed, 1.0, 1e-9,
            `Formula at 75% charge should give exactly 1.0×, got ${correctSpeed.toFixed(4)}`);
        // Also verify that 0% charge gives much less
        const zeroSpeed = Math.max(0.05, 0.0) / 0.75;
        assertLess(zeroSpeed, 0.1,
            `Formula at 0% charge should give < 10% speed, got ${(zeroSpeed*100).toFixed(1)}%`);
    });

    // ── Final render ───────────────────────────────────────────────────────
    renderResults();
});
</script>
</body>
</html>
